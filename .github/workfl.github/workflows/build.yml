name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        uses: tmarques/p4a-action@v1
        with:
          spec: buildozer.spec

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk文件
          path: ./bin/*.apk

